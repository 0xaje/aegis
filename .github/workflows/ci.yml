name: Aegis CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Formatting
        run: pnpm format:check

      - name: Run Linter
        run: pnpm lint

      - name: Compile Contracts
        run: pnpm --filter @aegis/contracts compile

      - name: Generate Prisma Client
        run: pnpm --filter @aegis/api db:generate

      - name: Compile TypeScript & Build Workspaces
        run: pnpm build
