version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: aegis-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aegis
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  hardhat-node:
    image: node:20-alpine
    container_name: aegis-hardhat-node
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
    ports:
      - '8545:8545'
    command: sh -c "pnpm --filter @aegis/contracts hardhat node"

volumes:
  pgdata:
